name: Evaluation / purchase availability
description: Request a non-binding update about ScopeLedger. Do not share private information.
title: "[Evaluation] "
body:
  - type: markdown
    attributes:
      value: "This is a PUBLIC issue. No payment is requested. Do not enter your email, company name, customer data, vulnerability evidence, secrets or payment information."
  - type: dropdown
    id: use_case
    attributes:
      label: Main workflow of interest
      options:
        - Executive reporting
        - Vulnerability evidence reconciliation
        - Remediation review
        - Asset dependency review
        - Other authorized defensive workflow
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Preferred application language
      options:
        - Korean
        - English
        - Other
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Public, non-binding request
      options:
        - label: I understand this issue is public, and I would like a reply here when evaluation or purchase availability is confirmed.
          required: true
